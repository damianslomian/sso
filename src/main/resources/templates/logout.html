<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .card { max-width: 520px; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; }
        .actions { margin-top: 1rem; display: flex; gap: .75rem; }
        .btn { padding: .6rem 1rem; border: none; border-radius: 6px; cursor: pointer; }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .hint { color: #555; margin-top: .5rem; font-size: .9rem; }
    </style>
    <script>
        function confirmLogout(e) {
            if (!confirm('Do you really want to logout?')) {
                e.preventDefault();
            }
        }
    </script>
    <!-- Thymeleaf will resolve th:* attributes at runtime -->
</head>
<body>
<div class="card">
    <h2>Sign out</h2>
    <p>You can sign out of this application. This will also end your SSO session.</p>

    <form th:action="@{/perform_logout}" method="post" onsubmit="confirmLogout(event)">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Logout</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <p class="hint">After logout, you'll be redirected back to this application.</p>
</div>
</body>
</html>
